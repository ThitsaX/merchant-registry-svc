# Default values for acquirer-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

acquirerBackend:
  replicaCount: 1
  image:
    repository: mojaloop/merchant-acquirer-backend
    tag: 0.0.3l
  service:
    type: ClusterIP
    port: 5555
  env:
    dbHost: merchant-db-clusterip-service
    dbPort: "3306"
    database: acquirer_db
    dbUsername: root
    # db password will be fetched from k8s secret object

    registryOracleHost: registry-oracle-clusterip-service
    registryOraclePort: "8888"
    registryInternalApiKey: change-me
    registryHttpTimeoutMs: "5000"
    registryHttpRetries: "2"
    emvcoMerchantAccountGui: "org.mojaloop"
    # Fallback for legacy merchants without an acquirer-assigned MCC.
    emvcoDefaultMcc: "0000"
    # Optional third-party email. Use "sendgrid" and supply both values to enable.
    emailProvider: "none"
    emailFrom: ""
    sendgridApiKey: ""
    s3Endpoint: minio-clusterip-service
    appURL: "http://www.acquirer-merchant.local" # for email verification backend link
    frontendSetPasswordRedirectURL: "http://www.acquirer-merchant.local/set-password" # reset password link after email verification
    recaptchaBackendSiteKey: "6LcEfT4pAAAAAF9a9PgebViC87aRPsd10JQDalNy"
