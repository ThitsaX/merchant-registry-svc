services:
  acquirer-backend:
    build:
      context: .
      dockerfile: Dockerfile-acquirer-backend
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      - APP_URL=http://127.0.0.1:5555
      - FRONTEND_SET_PASSWORD_URL=http://localhost:5173/set-password
      - HOST=0.0.0.0
      - PORT=5555

      - DB_HOST=merchant-db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - DB_DATABASE=acquirer_db

      - S3_ENDPOINT=minio
      - S3_PORT=9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_MERCHANT_BUCKET_NAME=merchant-documents

      - REGISTRY_ORACLE_URL=http://registry-oracle:8888
      - REGISTRY_INTERNAL_API_KEY=change-me
      - REGISTRY_HTTP_TIMEOUT_MS=5000
      - REGISTRY_HTTP_RETRIES=2

      - EMVCO_MERCHANT_ACCOUNT_GUI=${EMVCO_MERCHANT_ACCOUNT_GUI:-org.mojaloop}

      - RECAPTCHA_SECRET_KEY=your-recaptcha-secret-key
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED:-false}

      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-none}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}

      # GLEIF API Configuration
      - GLEIF_API_URL=https://api.gleif.org/api/v1
      - GLEIF_API_KEY=
    depends_on:
      - merchant-db
      - minio
      - registry-oracle

  acquirer-frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile-acquirer-frontend
    environment:
      - VITE_API_URL=http://127.0.0.1:5555/api/v1
      - VITE_RECAPTCHA_ENABLED=${VITE_RECAPTCHA_ENABLED:-false}
      - VITE_RECAPTCHA_SITE_KEY=your-recaptcha-site-key

    ports:
      - "5173:5173"

  registry-oracle:
    build:
      context: .
      dockerfile: Dockerfile-registry-oracle
    restart: unless-stopped
    ports:
      - 8888:8888
    environment:
      - HOST=0.0.0.0
      - PORT=8888

      - DB_HOST=merchant-db
      - DB_PORT=3306
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - DB_DATABASE=registry_db

      - REGISTRY_INTERNAL_API_KEY=change-me

    depends_on:
      - merchant-db

  merchant-db:
    container_name: mysql-db
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - 3306:3306
    volumes:
      - ./mysql-init-scripts:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:RELEASE.2023-07-21T21-12-44Z
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "9000:9000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data

volumes:
  data:
