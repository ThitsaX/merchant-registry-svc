imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

acquirerBackend:
  replicaCount: 1
  image:
    repository: ghcr.io/thitsax/merchant-acquirer-backend
    tag: v1.1.6
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5555
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  extraEnv: []

acquirerFrontend:
  replicaCount: 1
  image:
    repository: ghcr.io/thitsax/merchant-acquirer-frontend
    tag: v1.1.6
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5173
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv: []

registryOracle:
  replicaCount: 1
  image:
    repository: ghcr.io/thitsax/merchant-registry-oracle
    tag: v1.1.6
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8888
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  extraEnv: []

database:
  host: mysql
  port: 3306
  username: merchant_registry
  backendDatabase: acquirer_db
  oracleDatabase: registry_db
  passwordSecret:
    name: merchant-registry-db-secret
    key: mysql-password

auth:
  jwtExpiresIn: 1d
  jwtSecret:
    name: merchant-registry-jwt-secret
    key: secret

registry:
  # Empty means the in-chart Registry Oracle service.
  oracleUrl: ""
  httpTimeoutMs: 5000
  httpRetries: 2
  internalApiKeySecret:
    name: merchant-registry-internal-api-key
    key: secret

objectStorage:
  endpoint: minio
  port: 9000
  useSSL: false
  publicEndpoint: minio
  publicPort: 9000
  publicUseSSL: false
  region: us-east-1
  merchantBucket: merchant-documents
  dfspLogoBucket: dfsp-logos
  credentialsSecret:
    name: merchant-registry-s3-secret
    accessKeyKey: access-key
    secretKeyKey: secret-key

app:
  backendUrl: http://localhost:5555
  frontendSetPasswordUrl: http://localhost:5173/set-password
  frontendApiUrl: http://localhost:5555/api/v1

recaptcha:
  enabled: false
  frontendSiteKey: ""
  backendSecret:
    name: ""
    key: secret

email:
  # Supported values: none, sendgrid.
  provider: none
  from: ""
  sendgridApiKeySecret:
    name: ""
    key: api-key

emvco:
  merchantAccountGui: org.mojaloop

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
