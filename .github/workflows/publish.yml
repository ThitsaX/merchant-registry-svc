name: Publish container images

on:
  release:
    types: [published]

concurrency:
  group: publish-images-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: acquirer-backend
            image: merchant-acquirer-backend
            dockerfile: Dockerfile-acquirer-backend
          - name: acquirer-frontend
            image: merchant-acquirer-frontend
            dockerfile: Dockerfile-acquirer-frontend
          - name: registry-oracle
            image: merchant-registry-oracle
            dockerfile: Dockerfile-registry-oracle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize registry owner
        id: registry
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.registry.outputs.owner }}/${{ matrix.service.image }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=v(\d+\.\d+\.\d+),group=1
            type=match,pattern=v(\d+\.\d+)\.\d+,group=1
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: Image digest
        run: echo "${{ matrix.service.name }} -> ${{ steps.docker_build.outputs.digest }}"
