apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-acquirer-backend-deployment
spec:
  replicas: {{ .Values.acquirerBackend.replicaCount }}
  selector:
    matchLabels:
      component: acquirer-backend
  template:
    metadata:
      labels:
        component: acquirer-backend
    spec:
      containers:
        - name: acquirer-backend
          image: "{{ .Values.acquirerBackend.image.repository }}:{{ .Values.acquirerBackend.image.tag }}"
          ports:
            - containerPort: {{ .Values.acquirerBackend.service.port }}
          env:
          - name: APP_URL # for email redirect verification
            value: "{{ .Values.acquirerBackend.env.appURL }}"
          - name: FRONTEND_SET_PASSWORD_URL
            value: "{{ .Values.acquirerBackend.env.frontendSetPasswordRedirectURL }}"
          - name: RECAPTCHA_ENABLED
            value: "{{ .Values.acquirerBackend.env.recaptchaEnabled }}"
          - name: RECAPTCHA_SECRET_KEY
            value: "{{ .Values.acquirerBackend.env.recaptchaBackendSiteKey }}"
          - name: DB_HOST
            value: "{{ .Release.Name }}-{{ .Values.acquirerBackend.env.dbHost }}"
          - name: DB_PORT
            value: "{{ .Values.acquirerBackend.env.dbPort }}"
          - name: DB_DATABASE
            value: "{{ .Values.acquirerBackend.env.database }}"
          - name: DB_USERNAME
            value: "{{ .Values.acquirerBackend.env.dbUsername }}"
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-merchant-db-secret
                key: mysql-root-password
          - name: EMAIL_PROVIDER
            value: "{{ .Values.acquirerBackend.env.emailProvider }}"
          - name: EMAIL_FROM
            value: "{{ .Values.acquirerBackend.env.emailFrom }}"
          - name: SENDGRID_API_KEY
            value: "{{ .Values.acquirerBackend.env.sendgridApiKey }}"

          - name: S3_ENDPOINT
            value: "{{ .Release.Name }}-{{ .Values.acquirerBackend.env.s3Endpoint }}"

          - name: REGISTRY_ORACLE_URL
            value: "http://{{ .Release.Name }}-{{ .Values.acquirerBackend.env.registryOracleHost }}:{{ .Values.acquirerBackend.env.registryOraclePort }}"
          - name: REGISTRY_INTERNAL_API_KEY
            value: "{{ .Values.acquirerBackend.env.registryInternalApiKey }}"
          - name: REGISTRY_HTTP_TIMEOUT_MS
            value: "{{ .Values.acquirerBackend.env.registryHttpTimeoutMs }}"
          - name: REGISTRY_HTTP_RETRIES
            value: "{{ .Values.acquirerBackend.env.registryHttpRetries }}"
          - name: EMVCO_MERCHANT_ACCOUNT_GUI
            value: "{{ .Values.acquirerBackend.env.emvcoMerchantAccountGui }}"
          - name: EMVCO_DEFAULT_MCC
            value: "{{ .Values.acquirerBackend.env.emvcoDefaultMcc }}"
